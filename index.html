<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pixel Beasts</title><link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixel Beasts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head>
<body>
<div id="game">
  <canvas id="world" width="240" height="160"></canvas>
  <div id="hud"><b id="arrow">➤</b><span id="goal"></span></div>
  <div id="battle" hidden>
    <div class="box" id="foe"><b></b><i></i><div class="hp"><u></u></div><canvas width="48" height="48"></canvas></div>
    <div class="box" id="me"><b></b><i></i><div class="hp"><u></u></div><canvas width="48" height="48"></canvas></div>
    <div id="msg"></div><div id="menu"></div>
  </div>
  <div id="dlg" hidden></div>
  <div id="toast" hidden></div>
</div>
<div id="pad">
  <div class="dpad"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">▼</button></div>
  <div class="ab"><button data-k="b">BACK</button><button data-k="a">ENTER</button></div>
</div>
<script type="module" src="engine.js"></script>
</body></html>
